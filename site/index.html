<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#080808" />
    <meta
      name="description"
      content="Stefan’s Spinners — Loading spinners for React. A little spin, a little glow, and you’re ready to go."
    />
    <title>Stefan’s Spinners</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/spinners.css" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="starfield" aria-hidden="true">
      <div class="star-layer stars-far"></div>
      <div class="star-layer stars-near"></div>
      <div class="star-glints">
        <span style="--x:12%;--y:18%;--delay:-2s"></span>
        <span style="--x:79%;--y:12%;--delay:-5s"></span>
        <span style="--x:92%;--y:64%;--delay:-8s"></span>
        <span style="--x:24%;--y:79%;--delay:-11s"></span>
      </div>
    </div>
    <button class="star-motion" id="star-motion" type="button" aria-pressed="false" aria-label="Pause star background">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 0.5 9.6 6.4 15.5 8 9.6 9.6 8 15.5 6.4 9.6 .5 8 6.4 6.4Z"/></svg>
      <span>Pause stars</span>
    </button>
    <a class="skip" href="#content">Skip to content</a>
    <header class="mobile-header">
      <a
        href="/"
        data-route
        class="brand-link"
        aria-label="Stefan’s Spinners — Home"
      ><span class="logo" aria-hidden="true"></span><span class="brand-wordmark">Stefan's Spinners</span></a
      ><button
        id="menu"
        class="icon-button"
        aria-label="Open navigation"
        aria-expanded="false"
        aria-controls="sidebar"
      ></button>
    </header>
    <button id="nav-backdrop" aria-label="Close navigation" hidden></button>
    <aside id="sidebar">
      <div class="brand">
        <a
          href="/"
          data-route
          class="brand-link"
          aria-label="Stefan’s Spinners — Home"
          title="Stefan’s Spinners"
        ><span class="logo" aria-hidden="true"></span><span class="brand-wordmark">Stefan's Spinners</span></a>
      </div>
      <div class="search-wrap">
        <button
          id="search-trigger"
          aria-label="Search"
          aria-keyshortcuts="Meta+K"
        >
          <span data-icon="search" aria-hidden="true"></span><span>Find a spinner</span
          ><span class="keys"><kbd>⌘</kbd><kbd>K</kbd></span>
        </button>
      </div>
      <div class="navigation-scroll">
        <nav aria-label="Main">
          <a href="/" data-route id="overview-link">Overview</a>
          <div id="spinner-nav"></div>
        </nav>
      </div>
      <div class="sidebar-bottom">
        <nav aria-label="Social">
          <a
            href="https://github.com/Stefan-Mihajlovic/stefans-spinners"
            target="_blank"
            rel="noreferrer"
            ><span data-icon="github" aria-hidden="true"></span>GitHub</a
          ><a
            id="npm-link"
            href="https://www.npmjs.com/package/stefans-spinners"
            target="_blank"
            rel="noreferrer"
          >
            <span data-icon="npm" aria-hidden="true"></span>npm</a
          ><a href="/llms.txt" target="_blank"
            ><span data-icon="markdown" aria-hidden="true"></span>llms.txt</a
          >
        </nav>
        <div class="credit">
          A collection by
          <a
            href="https://stefanmihajlovic.com"
            target="_blank"
            rel="noreferrer"
            ><img
              src="https://github.com/Stefan-Mihajlovic.png?size=32"
              alt=""
              width="16"
              height="16"
            />
            Stefan Mihajlovic</a
          >
        </div>
      </div>
    </aside>
    <div id="page-shell"><main id="content" tabindex="-1"></main></div>
    <aside id="page-nav" hidden></aside>
    <dialog id="search-dialog" aria-label="Search spinners">
      <div class="search-heading">
        <span class="search-brand"><span class="logo" aria-hidden="true"></span>Stefan's Spinners</span>
        <button id="close-search" aria-label="Close search" aria-keyshortcuts="Escape"><kbd>esc</kbd><span data-icon="close" aria-hidden="true"></span></button>
      </div>
      <div class="search-input-wrap">
        <span data-icon="search" aria-hidden="true"></span>
        <input
          id="search"
          type="search"
          placeholder="Find a spinner…"
          aria-label="Search spinners"
          role="combobox"
          aria-expanded="true"
          aria-controls="search-results"
          autocomplete="off"
        />
      </div>
      <div id="search-results" role="listbox" aria-label="Suggestions"></div>
      <footer class="search-footer">
        <span id="search-count" role="status"></span>
        <span class="search-key-hint"><kbd>↑</kbd><kbd>↓</kbd> Navigate</span>
        <span class="search-key-hint"><kbd>↵</kbd> Open</span>
      </footer>
    </dialog>
    <div id="toast" role="status"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
